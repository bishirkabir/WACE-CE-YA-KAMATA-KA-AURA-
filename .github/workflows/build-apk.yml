name: Build Wace Ce Ya Kamata Ka Aura APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract the Zoom Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*ANDROID_ZOOM*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Cannot find the Android ZIP with ZOOM in its filename."
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project
          SETTINGS_FILE=$(find android-project -type f -name settings.gradle -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project folder: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WACE-CE-YA-KAMATA-KA-AURA-ZOOM-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
